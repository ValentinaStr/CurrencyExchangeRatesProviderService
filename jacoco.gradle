jacoco {
    toolVersion = "0.8.12"
}

def excludedClasses = [
        "com/currencyexchange/CurrencyExchangeRatesProviderServiceApplication.class",
        "com/currencyexchange/config/**",
        "com/currencyexchange/dto/**",
        "com/currencyexchange/entity/**",
        "com/currencyexchange/mapper/**",
        "com/currencyexchange/model/**",
        "com/currencyexchange/repository/**"
]

tasks.jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: excludedClasses)
    }))
}

tasks.jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
        fileTree(dir: it, exclude: excludedClasses)
    }))
}

tasks.check {
    dependsOn jacocoTestCoverageVerification
}
